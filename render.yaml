# One-click deploy of the file converter on Render (render.com).
# Dashboard > New > Blueprint > pick this repository.
# Then set VITE_MSPROJECT_BACKEND_URL in Netlify to the service's address.
services:
  - type: web
    name: project-planner-converter
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/convert/status
    envVars:
      # Only your website may call the converter from a browser.
      - key: ALLOWED_ORIGINS
        value: https://project-planner-prolim.netlify.app
